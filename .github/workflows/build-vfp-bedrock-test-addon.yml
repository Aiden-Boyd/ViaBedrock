name: Build Standalone Bedrock Fabric Mod

on:
  workflow_dispatch:
  push:
    branches:
      - integration/inventory-current

permissions:
  contents: read

jobs:
  build-test-addon:
    runs-on: macos-latest
    steps:
      - name: Checkout ViaBedrock branch
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Publish this ViaBedrock build to Maven Local
        run: ./gradlew clean publishToMavenLocal

      - name: Clone ViaFabricPlus Bedrock
        run: |
          git clone --depth 1 https://github.com/ViaVersionAddons/viafabricplus-bedrock.git ../viafabricplus-bedrock
          git -C ../viafabricplus-bedrock checkout 1268aa42bf0f96c63058906e07a9cd05534565af

      - name: Patch addon for current ViaBedrock API and Maven Local
        working-directory: ../viafabricplus-bedrock
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          settings = Path("settings.gradle.kts")
          text = settings.read_text()
          match = re.search(r'(dependencyResolutionManagement\s*\{\s*repositories\s*\{)', text, re.S)
          if not match:
              raise SystemExit("dependencyResolutionManagement repositories block not found")
          tail = text[match.end():]
          boundary = tail.find("\n    }")
          repo_block = tail if boundary == -1 else tail[:boundary]
          if "mavenLocal()" not in repo_block:
              text = text[:match.end()] + "\n        mavenLocal()" + text[match.end():]
          settings.write_text(text)

          for path in Path("src/main/java").rglob("*.java"):
              source = path.read_text()
              updated = source.replace(
                  "BedrockProtocolVersion.bedrockLatest",
                  "BedrockProtocolVersion.BEDROCK_LATEST",
              )
              if updated != source:
                  path.write_text(updated)

          config = Path(
              "src/main/java/com/viaversion/viafabricplus/bedrock/"
              "protocoltranslator/platform/ViaFabricPlusViaBedrockConfig.java"
          )
          if config.exists():
              source = config.read_text()
              source = source.replace(
                  "import com.viaversion.viafabricplus.bedrock.ViaFabricPlusBedrock;\n",
                  "",
              )
              source = re.sub(
                  r'\n\s*@Override\s*\n\s*public boolean shouldEnableExperimentalFeatures\(\)\s*\{.*?\n\s*\}\s*',
                  '\n',
                  source,
                  flags=re.S,
              )
              config.write_text(source)
          PY

      - name: Apply native friends and Realms menu integration
        working-directory: ../viafabricplus-bedrock
        run: python3 ../ViaBedrock/tools/addon/apply-menu-overlay.py

      - name: Build addon
        working-directory: ../viafabricplus-bedrock
        run: ./gradlew clean build --refresh-dependencies

      - name: Open Multiplayer and Realms in a development client
        working-directory: ../viafabricplus-bedrock
        timeout-minutes: 5
        run: python3 ../ViaBedrock/tools/addon/smoke-menu-client.py

      - name: Preserve Minecraft runtime logs on smoke failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-menu-failure
          path: |
            ../viafabricplus-bedrock/run/logs/latest.log
            ../viafabricplus-bedrock/run/crash-reports/*.txt
          retention-days: 7

      - name: Launch packaged mod without external ViaVersion or ViaFabricPlus
        working-directory: ../viafabricplus-bedrock
        timeout-minutes: 6
        run: python3 ../ViaBedrock/tools/addon/smoke-standalone-client.py

      - name: Inspect Minecraft menu APIs
        working-directory: ../viafabricplus-bedrock
        run: |
          python3 ../ViaBedrock/tools/addon/inspect-menu-api.py

      - name: Verify native menu integration
        working-directory: ../viafabricplus-bedrock
        run: python3 ../ViaBedrock/tools/addon/verify-menu-overlay.py

      - name: Verify custom ViaBedrock code was embedded
        run: |
          LOCAL_JAR="$HOME/.m2/repository/net/raphimc/ViaBedrock/0.0.31-SNAPSHOT/ViaBedrock-0.0.31-SNAPSHOT.jar"
          STAGED_JAR="../viafabricplus-bedrock/build/processIncludeJars/ViaBedrock-0.0.31-SNAPSHOT.jar"
          CLASS_PATH="net/raphimc/viabedrock/protocol/packet/ClientPlayerPackets.class"

          mkdir -p verify
          unzip -p "$LOCAL_JAR" "$CLASS_PATH" > verify/local.class
          unzip -p "$STAGED_JAR" "$CLASS_PATH" > verify/staged.class

          test -s verify/local.class
          test -s verify/staged.class

          LOCAL_HASH="$(shasum -a 256 verify/local.class | awk '{print $1}')"
          STAGED_HASH="$(shasum -a 256 verify/staged.class | awk '{print $1}')"

          echo "Custom class: $LOCAL_HASH"
          echo "Staged class: $STAGED_HASH"
          test "$LOCAL_HASH" = "$STAGED_HASH"

      - name: Prepare artifact
        run: |
          mkdir -p artifact
          SHORT_SHA="$(git rev-parse --short HEAD)"
          cp ../viafabricplus-bedrock/build/libs/viafabricplus-bedrock-1.1.1-SNAPSHOT.jar \
            "artifact/viabedrock-standalone-$SHORT_SHA.jar"

      - name: Upload verified standalone mod
        uses: actions/upload-artifact@v4
        with:
          name: viabedrock-standalone
          path: artifact/*.jar
          if-no-files-found: error
          retention-days: 14

